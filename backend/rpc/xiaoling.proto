syntax = "proto3";

package xiaoling;

// 小凌 v0.0.1：Flutter(UI) + Python(AI后端) + gRPC(通信) 混合架构
// Flutter 客户端通过 localhost:50051 与 Python 后端通信。

service XiaoLing {
  // ===== 对话 =====
  rpc Chat (ChatRequest) returns (stream ChatChunk);

  // ===== 状态 =====
  rpc GetStatus (StatusRequest) returns (StatusReply);

  // ===== 成长 / 训练（Flutter 可视化） =====
  rpc GetGrowthStatus (Empty) returns (GrowthStatusReply);
  rpc GetTrainingStatus (Empty) returns (TrainingStatusReply);

  // ===== 插件系统 =====
  rpc ListPlugins (Empty) returns (PluginList);
  rpc EnablePlugin (PluginToggleRequest) returns (StatusReply);
  rpc DisablePlugin (PluginToggleRequest) returns (StatusReply);

  // ===== 启动训练（流式进度） =====
  rpc StartTraining (TrainingRequest) returns (stream TrainingProgress);
  rpc GetTrainingHistory (Empty) returns (TrainingHistoryReply);

  // ===== 模型管理 =====
  rpc ListModels (ListRequest) returns (ModelList);
  rpc SwitchModel (SwitchModelRequest) returns (StatusReply);

  // ===== 动作 =====
  rpc ListActions (ListRequest) returns (ActionList);
  rpc PlayAction (PlayActionRequest) returns (StatusReply);

  // ===== 指令 =====
  rpc ExecuteCommand (CommandRequest) returns (CommandReply);

  // ===== 关闭 =====
  rpc Shutdown (ShutdownRequest) returns (StatusReply);

  // ===== 硬件检测 =====
  rpc DetectHardware (Empty) returns (HardwareInfo);

  // ===== 智能模型推荐 =====
  rpc ListRecommendedModels (HardwareRequest) returns (RecommendedModelList);

  // ===== 模型下载（流式进度） =====
  rpc DownloadModel (DownloadRequest) returns (stream DownloadProgress);

  // ===== 列出已安装模型 =====
  rpc ListInstalledModels (Empty) returns (ModelList);

  // ===== 删除模型 =====
  rpc DeleteModel (ModelNameRequest) returns (StatusReply);

  // ===== 音色列表 =====
  rpc ListVoices (Empty) returns (VoiceList);

  // ===== 切换音色 =====
  rpc SetVoice (VoiceRequest) returns (StatusReply);

  // ===== 语音朗读（流式音频） =====
  rpc ReadAloud (ReadRequest) returns (stream AudioChunk);

  // ===== 语音识别（上传音频转文字；音频为空则服务端现场录音） =====
  rpc Transcribe (TranscribeRequest) returns (TranscribeReply);

  // ===== 读取设置 =====
  rpc GetSettings (Empty) returns (SettingsReply);

  // ===== 更新设置 =====
  rpc UpdateSettings (SettingsRequest) returns (StatusReply);

  // ===== 数据导出 / 导入 =====
  rpc ExportData (Empty) returns (DataBlob);
  rpc ImportData (DataBlob) returns (StatusReply);

  // ===== 人格画像（情绪 / 亲密度 / 等级） =====
  rpc GetPersona (Empty) returns (PersonaReply);

  // ===== 人格预设列表（5 个内置 + 用户自定义） =====
  rpc ListPersonas (Empty) returns (PersonaList);

  // ===== 切换人格预设 =====
  rpc SetPersona (PersonaRequest) returns (StatusReply);

  // ===== 新增自定义人格 =====
  rpc AddPersona (PersonaRequest) returns (StatusReply);

  // ===== 删除自定义人格 =====
  rpc DeletePersona (ModelNameRequest) returns (StatusReply);

  // ===== 重置人格画像（情绪/亲密度清零） =====
  rpc ResetPersona (Empty) returns (StatusReply);

  // ===== 提醒队列（含未读提醒，铃铛面板用） =====
  rpc ListReminders (Empty) returns (ReminderList);

  // ===== 标记提醒已读 / 完成 =====
  rpc CompleteReminder (ReminderRequest) returns (StatusReply);

  // ===== Agent 自主任务模式 =====
  rpc AgentStart (AgentRequest) returns (stream AgentEvent);

  // ===== 内置终端 =====
  rpc TerminalCreate (Empty) returns (TerminalSession);
  rpc TerminalWrite (TerminalInput) returns (Empty);
  rpc TerminalRead (TerminalSessionId) returns (stream TerminalOutput);
  rpc TerminalClose (TerminalSessionId) returns (Empty);

  // ===== 文件操作 =====
  rpc FileList (FileListRequest) returns (FileListReply);
  rpc FileRead (FileReadRequest) returns (FileContent);
  rpc FileWrite (FileWriteRequest) returns (StatusReply);

  // ===== 代码搜索 =====
  rpc CodeSearch (CodeSearchRequest) returns (CodeSearchReply);

  // ===== 项目上下文 =====
  rpc ProjectContext (Empty) returns (ProjectContextReply);
}

// ===== 基础消息 =====
message Empty {}

message ChatRequest {
  string text = 1;
}

message ChatChunk {
  string delta = 1;
  bool   done  = 2;
  string error = 3;
}

message StatusRequest {}

message StatusReply {
  bool   ok       = 1;
  string message  = 2;
  string stage    = 3;
  string model    = 4;
  string backend  = 5;
  double progress = 6;
  string version  = 7;
}

message ListRequest {}

message ModelInfo {
  string name = 1;
  string path = 2;
  double size_mb = 3;
}

message ModelList {
  repeated ModelInfo models = 1;
}

message SwitchModelRequest {
  string path = 1;
}

message CommandRequest {
  string command = 1;
}

message CommandReply {
  string output = 1;
}

message ActionInfo {
  string name  = 1;
  string path  = 2;
  bool   dance = 3;
  bool   idle  = 4;
}

message ActionList {
  repeated ActionInfo actions = 1;
}

message PlayActionRequest {
  string path = 1;
}

message ShutdownRequest {}

// ===== 成长状态（Flutter 可视化） =====
message GrowthStatusReply {
  string stage = 1;           // 初始化 / 适配期 / 晋升中 / 已晋升
  double progress_percent = 2;
  int32 total_interactions = 3;
  int32 current_generation = 4;
  int32 total_generations = 5;
  string current_rank = 6;    // 青铜 / 白银 / 黄金 ...
  string emotion = 7;
  bool training_paused = 8;
  string status_text = 9;      // 人类可读状态，如「成长中：3.5%」
}

// ===== 训练状态（Flutter 五维可视化） =====
message TrainingDimension {
  string name = 1;    // 感知 / 理解 / 决策 / 进化 / 守护
  double value = 2;   // 0-100
  string label = 3;
}
message TrainingStatusReply {
  bool is_training = 1;
  int32 current_epoch = 2;
  int32 total_epochs = 3;
  double loss = 4;
  repeated TrainingDimension dimensions = 5;
  string status_text = 6;
}

// ===== 插件列表 =====
message PluginInfo {
  string name = 1;
  string description = 2;
  string version = 3;
  bool enabled = 4;
  string category = 5;
}
message PluginList {
  repeated PluginInfo plugins = 1;
}

// ===== 启动训练请求 / 进度 =====
message TrainingRequest {
  int32 steps = 1;
  double learning_rate = 2;
  int32 batch_size = 3;
  int32 lora_rank = 4;
  string dataset_name = 5;
}

message TrainingProgress {
  int32 step = 1;
  int32 total_steps = 2;
  float loss = 3;
  string status = 4;
}

message TrainingHistoryEntry {
  int64 timestamp = 1;
  int32 steps = 2;
  float final_loss = 3;
  repeated float loss_curve = 4;
}
message TrainingHistoryReply {
  repeated TrainingHistoryEntry entries = 1;
}

message PluginToggleRequest {
  string name = 1;
}

message DataBlob {
  string json = 1;
}

// ===== 硬件检测 =====
message HardwareInfo {
  double vram_gb = 1;
  double ram_gb = 2;
  int32 cpu_cores = 3;
  double disk_free_gb = 4;
  string gpu_name = 5;
  string platform = 6;
  bool has_cuda = 7;
  bool has_metal = 8;
}

message HardwareRequest {
  // 可传入自定义硬件信息，留空则自动检测
}

// ===== 模型商店 =====
message RecommendedModel {
  string name = 1;
  string params = 2;
  string quant = 3;
  double vram_gb = 4;
  double ram_gb = 5;
  int32 quality = 6;
  string context = 7;
  double size_mb = 8;
  bool can_run = 9;
  bool recommended = 10;
}

message RecommendedModelList {
  repeated RecommendedModel models = 1;
}

message DownloadRequest {
  string model_name = 1;
  string quant = 2;
}

message DownloadProgress {
  double percent = 1;
  double downloaded_mb = 2;
  double total_mb = 3;
  string status = 4;  // downloading / done / failed
}

message ModelNameRequest {
  string name = 1;
}

// ===== 音色 =====
message VoiceInfo {
  string id = 1;
  string name = 2;
  string lang = 3;
}

message VoiceList {
  repeated VoiceInfo voices = 1;
}

message VoiceRequest {
  string voice_id = 1;
}

message ReadRequest {
  string text = 1;
  string rate = 2;
}

message AudioChunk {
  bytes data = 1;
  bool done = 2;
}

message TranscribeRequest {
  bytes audio = 1;
  int32 seconds = 2;
  string lang = 3;
}

message TranscribeReply {
  string text = 1;
  bool ok = 2;
  string error = 3;
  int32 duration_ms = 4;
  bool recorded = 5;
}

// ===== 设置 =====
message SettingsReply {
  string model = 1;
  string voice = 2;
  string render_backend = 3;
  bool always_on_top = 4;
  bool auto_start = 5;
  bool asr_enabled = 6;
  bool tts_enabled = 7;
  bool read_aloud_mode = 8;
  // 人格预设名（活跃中），对应 config.persona
  string persona = 9;
  // 用户名，对应 config.user_name
  string user_name = 10;
}

message SettingsRequest {
  optional string model = 1;
  optional string voice = 2;
  optional string render_backend = 3;
  optional bool always_on_top = 4;
  optional bool auto_start = 5;
  optional bool asr_enabled = 6;
  optional bool tts_enabled = 7;
  optional bool read_aloud_mode = 8;
  optional string persona = 9;
  optional string user_name = 10;
}

// ===== 人格画像（PersonaEngine 快照） =====
message PersonaReply {
  string emotion = 1;          // 中文情绪标签，如「开心」
  double emotion_intensity = 2;// 0-1
  string relationship = 3;      // 亲密度等级，如「相识」
  double relationship_score = 4;// 累计亲密度分
  double relationship_progress = 5; // 距下一级进度 0-1
  int32  reminders_pending = 6; // 未完成提醒数
  string persona = 7;          // 当前人格预设名
  string user_name = 8;
  // 五维情绪构成，用于雷达图
  repeated PersonaAxis axes = 9;
}

message PersonaAxis {
  string name = 1;   // joy / anger / sad / fear / calm / surprise
  string label = 2;  // 中文：喜悦 / 愤怒 / 悲伤 / 恐惧 / 平静 / 惊讶
  double value = 3;  // 0-100
}

// ===== 人格预设 =====
message PersonaPreset {
  string id = 1;       // 唯一 id（内置固定 / 自定义为custom_<ts>）
  string name = 2;     // 预设名，如「活泼」
  string description = 3;   // 一句话描述
  string prompt_hint = 4;   // 注入到 system prompt 的语气引导
  bool builtin = 5;    // 是否内置
  bool active = 6;     // 当前是否生效
}

message PersonaList {
  repeated PersonaPreset presets = 1;
}

message PersonaRequest {
  string id = 1;    // 内置传 id，自定义新增时传 name 即可
  string name = 2;  // 自定义人格名
  string description = 3;
  string prompt_hint = 4;
}

// ===== 提醒队列 =====
message ReminderItem {
  string text = 1;
  double due_at = 2;      // unix 时间戳
  bool   done = 3;
  double created_at = 4;
  int64  seconds_left = 5;// 距离触发的剩余秒数（负数为已过期未读）
}

message ReminderList {
  repeated ReminderItem items = 1;
  int32 unread = 2;   // 未读（已到期未确认）数量
  int32 pending = 3;  // 未完成（含未到期）数量
}

message ReminderRequest {
  double due_at = 1;
}

// ===== Agent 自主任务 =====
message AgentRequest {
  string task = 1;
  string context = 2;
  bool autonomous = 3;
  int32 max_steps = 4;
}

message AgentEvent {
  string type = 1;
  string content = 2;
  string tool_name = 3;
  string tool_args = 4;
  string tool_result = 5;
  int32 step = 6;
  int32 total_steps = 7;
  bool done = 8;
  string error = 9;
}

// ===== 终端 =====
message TerminalSession {
  string id = 1;
}

message TerminalInput {
  string session_id = 1;
  string data = 2;
}

message TerminalSessionId {
  string id = 1;
}

message TerminalOutput {
  string data = 1;
  bool closed = 2;
}

// ===== 文件操作 =====
message FileListRequest {
  string path = 1;
}

message FileItem {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  int64 size = 4;
  string modified = 5;
  string extension = 6;
}

message FileListReply {
  repeated FileItem items = 1;
  string current_path = 2;
  string parent_path = 3;
}

message FileReadRequest {
  string path = 1;
}

message FileContent {
  string path = 1;
  string content = 2;
  string language = 3;
  int32 lines = 4;
  int64 size = 5;
}

message FileWriteRequest {
  string path = 1;
  string content = 2;
  bool append = 3;
}

// ===== 代码搜索 =====
message CodeSearchRequest {
  string query = 1;
  string type = 2;
  string path = 3;
  int32 max_results = 4;
}

message CodeMatch {
  string file = 1;
  int32 line = 2;
  int32 column = 3;
  string text = 4;
  string symbol = 5;
  string kind = 6;
}

message CodeSearchReply {
  repeated CodeMatch matches = 1;
  int32 total = 2;
  double elapsed_ms = 3;
}

// ===== 项目上下文 =====
message ProjectFile {
  string path = 1;
  string language = 2;
  int32 lines = 3;
}

message ProjectContextReply {
  string root_path = 1;
  string project_name = 2;
  repeated ProjectFile files = 3;
  int32 total_files = 4;
  int32 total_lines = 5;
  repeated string languages = 6;
  string readme = 7;
}
