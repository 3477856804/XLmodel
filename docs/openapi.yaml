openapi: 3.0.3
info:
  title: 小凌 XLmodel 本地接口
  version: 1.1.0
  description: |
    小凌是本地单机应用，默认不对外暴露 HTTP 服务；本文件描述的是
    「若把成长引擎包装成本地 HTTP 服务」时推荐采用的契约形态，
    以及渲染层/成长引擎的字段约定。字段名与 core/*.py 返回值保持一致。
paths:
  /growth/status:
    get:
      summary: 成长状态
      responses:
        '200':
          description: 状态对象
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrowthStatus' }
  /growth/trigger:
    get:
      summary: 判定当前能否训练
      parameters:
        - { name: manual, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: 判定结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerResult' }
  /growth/train:
    post:
      summary: 训练一轮并自动检查
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                epochs: { type: integer, default: 2 }
                manual: { type: boolean, default: false }
      responses:
        '200': { description: 训练与检查结果 }
  /growth/eval:
    get:
      summary: 晋升三条件评估
      responses:
        '200':
          description: 三条件结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvalResult' }
  /growth/rollback:
    post:
      summary: 回滚到指定代
      responses:
        '200': { description: 回滚结果 }
  /growth/export:
    post:
      summary: 导出模型包
      responses:
        '200': { description: 导出结果 }
  /growth/samples:
    get:
      summary: 样本 / 蒸馏 / 损失曲线摘要
      responses:
        '200': { description: 摘要 }
components:
  schemas:
    GrowthStatus:
      type: object
      properties:
        base_bytes: { type: integer }
        adapter_bytes: { type: integer }
        progress_percent: { type: number }
        promotions: { type: integer }
        self_research: { type: boolean }
        paused: { type: boolean }
        rank: { type: integer }
        can_train_now: { type: boolean }
        train_blockers: { type: array, items: { type: string } }
        stage: { type: string }
    TriggerResult:
      type: object
      properties:
        ok: { type: boolean }
        reasons: { type: array, items: { type: string } }
        need_samples: { type: integer }
        samples: { type: integer }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    EvalResult:
      type: object
      properties:
        pass: { type: boolean }
        simulated: { type: boolean }
        summary: { type: string }
        A: { $ref: '#/components/schemas/Condition' }
        B: { $ref: '#/components/schemas/Condition' }
        C: { $ref: '#/components/schemas/Condition' }
    Condition:
      type: object
      properties:
        ok: { type: boolean }
        mode: { type: string, enum: [real, simulated, requires_torch, no_data, error] }
        detail: { type: string }
