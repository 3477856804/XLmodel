syntax = "proto3";

package xiaoling;

// 小凌 v0.0.3：Flutter(UI) + Python(AI后端) + gRPC(通信) 混合架构
// Flutter 客户端通过 localhost:50051 与 Python 后端通信。

service XiaoLing {
  // 对话（流式返回，模拟打字机效果）
  rpc Chat (ChatRequest) returns (stream ChatChunk);

  // 获取当前状态（成长阶段 / 模型档位 / 渲染后端）
  rpc GetStatus (StatusRequest) returns (StatusReply);

  // 列出可用角色模型
  rpc ListModels (ListRequest) returns (ModelList);

  // 切换角色模型
  rpc SwitchModel (SwitchModelRequest) returns (StatusReply);

  // 执行终端指令（/帮助、/成长报告 等）
  rpc ExecuteCommand (CommandRequest) returns (CommandReply);

  // 列出可用动作
  rpc ListActions (ListRequest) returns (ActionList);

  // 播放动作
  rpc PlayAction (PlayActionRequest) returns (StatusReply);

  // 关闭后端
  rpc Shutdown (ShutdownRequest) returns (StatusReply);
}

message ChatRequest {
  string text = 1;
}

message ChatChunk {
  string delta = 1;      // 增量文本
  bool   done  = 2;      // 是否结束
  string error = 3;      // 错误信息（done=true 时可能有）
}

message StatusRequest {}

message StatusReply {
  bool   ok          = 1;
  string message     = 2;
  string stage       = 3;   // 成长阶段
  string model       = 4;   // 当前模型名
  string backend     = 5;   // 渲染后端
  double progress    = 6;   // 0~100
  string version     = 7;
}

message ListRequest {}

message ModelInfo {
  string name = 1;
  string path = 2;
}

message ModelList {
  repeated ModelInfo models = 1;
}

message SwitchModelRequest {
  string path = 1;
}

message CommandRequest {
  string command = 1;   // 不含前导斜杠，如 "帮助"
}

message CommandReply {
  string output = 1;
}

message ActionInfo {
  string name  = 1;
  string path  = 2;
  bool   dance = 3;
  bool   idle  = 4;
}

message ActionList {
  repeated ActionInfo actions = 1;
}

message PlayActionRequest {
  string path = 1;
}

message ShutdownRequest {}
