buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://chaquo.com/maven" }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.11.1"
        classpath "com.chaquo.python:gradle:15.0.1"
    }
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.chaquo.python"
}

android {
    namespace = "com.xiaoling.frontend"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.xiaoling.frontend"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        python {
            version "3.8"
            // 指定「构建机上的 Python」：Chaquopy 会用它创建隔离环境来 pip 安装
            // grpcio/protobuf，**不是**运行时的 Python（运行时版本由上面的 version 决定）。
            //
            // 必须显式指定的原因：Python 3.13 起标准库删除了 cgi（PEP 594），而 Chaquopy
            // 自带 pip 的 index/collector 仍在 `import cgi`。本机 PATH 上第一位是
            // Python 3.14，Chaquopy 自动挑到它就必然崩：
            //     ModuleNotFoundError: No module named 'cgi'
            //     > Task :app:generateReleasePythonRequirements FAILED
            // 这里钉到 3.12；路径走环境变量 CHAQUOPY_BUILD_PYTHON，换机器不必改脚本。
            buildPython System.getenv("CHAQUOPY_BUILD_PYTHON") ?: "python"
            pip {
                install "grpcio"
                install "protobuf"
            }
        }
    }

    sourceSets {
        main {
            python {
                srcDirs = ["src/main/python"]
            }
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
