[pytest]
# 重构后测试目录统一为英文 tests/（历史上曾误写为中文「测试/」，
# 且 pytest.ini 只放在 tests/ 下从未被 rootdir 读取，testpaths 完全失效）。
# 本文件必须放在**仓库根**，pytest 才会以它为 rootdir 配置。
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q

# 重构前的遗留用例（tests/test_renderer.py / test_growth.py / test_imports.py）
# 依赖已删除的 renderer 包与旧 GrowthEngine 签名，按「绝不删文件」红线保留原文件，
# 由 tests/conftest.py 的 collect_ignore 默认排除。
# 想看它们的真实失败原因：
#     pytest tests/test_growth.py -p no:cacheprovider --override-ini="addopts="