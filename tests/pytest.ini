[pytest]
# 重构后测试目录统一为英文 tests/（曾误写为中文「测试/」与 testpaths 不一致，
# 导致直接跑 `pytest` 会报 file or directory not found）。
testpaths = tests
python_files = test_*.py
python_functions = test_*
# 每个测试文件同时保留 `python tests/test_x.py` 的脚本式入口，
# 所以不强制 import mode，两种跑法都支持。
addopts = -q
# 重构前的遗留用例（依赖已删除的 renderer 包与旧 GrowthEngine 签名）标记为跳过，
# 详见 tests/test_legacy.py 的说明。新架构用例见 test_contracts.py。
markers =
    legacy: 重构前的遗留测试，依赖已移除的模块，默认跳过
