name: flutter-release

# 打 tag 形如 flutter-v0.0.1 时触发，自动打包三平台 Flutter 桌面端
on:
  push:
    tags: ['flutter-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- Windows: zip ---------------- #
  build-windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.27.4', channel: 'stable' }
      - name: 强制 Flutter 使用 VS2022
        shell: bash
        run: |
          VS_FILE="$FLUTTER_ROOT/packages/flutter_tools/lib/src/windows/visual_studio.dart"
          sed -i 's/Visual Studio 16 2019/Visual Studio 17 2022/g' "$VS_FILE"
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"
          echo "Patched: $(grep 'Visual Studio 17' "$VS_FILE" | head -1)"
      - run: flutter create . --platforms=windows --project-name=xiaoling
      - run: flutter pub get
      - run: flutter build windows --release
      - name: 打包 zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "xiaoling-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoling-windows
          path: frontend/xiaoling-windows-x64.zip

  # ---------------- macOS: .dmg ---------------- #
  build-macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.27.4', channel: 'stable' }
      - run: flutter create . --platforms=macos --project-name=xiaoling
      - run: flutter pub get
      - run: flutter build macos --release
      - name: 打 .dmg
        run: |
          mkdir -p dist
          hdiutil create -volname "XiaoLing" -srcfolder build/macos/Build/Products/Release/xiaoling.app \
            -ov -format UDZO dist/xiaoling-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoling-macos
          path: frontend/dist/*.dmg

  # ---------------- Linux: tar.gz ---------------- #
  build-linux:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.27.4', channel: 'stable' }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libgtk-3-dev libblkid-dev liblzma-dev
      - run: flutter create . --platforms=linux --project-name=xiaoling
      - run: flutter pub get
      - run: flutter build linux --release
      - name: 打包 tar.gz
        run: |
          cd build/linux/x64/release/bundle/ && tar czf ../../../../../xiaoling-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoling-linux
          path: frontend/xiaoling-linux-x64.tar.gz

  # ---------------- 汇总到 Release ---------------- #
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-v0.0.1
          files: artifacts/**/*
          generate_release_notes: true
          name: 小凌 Flutter 桌面端 v0.0.1
