name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 本工作流只做静态检查，告警不应阻断构建：
#   - Python 语法检查必须通过（编译失败才报错）；
#   - flake8 风格告警用 --exit-zero，仅记录不失败；
#   - Dart/Flutter analyze 用 continue-on-error，环境支持时跑、失败不阻断。

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check (py_compile)
        run: |
          python -m compileall -q backend main.py

      - name: flake8 (warnings only, non-blocking)
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 backend main.py --max-line-length=120 --exit-zero || true

  dart-analyze:
    runs-on: ubuntu-latest
    # Flutter analyze 依赖完整 SDK 与系统库，失败不阻断主线
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable

      - name: flutter analyze
        run: |
          cd frontend
          flutter pub get
          flutter analyze
