name: Build All Platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.0"
  APP_VERSION: "0.0.1"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev liblzma-dev libstdc++-12-dev ninja-build libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install minimal Python deps
        run: |
          pip install grpcio grpcio-tools protobuf Pillow numpy requests aiohttp
          pip install pyinstaller
      - name: Bundle backend
        run: |
          pyinstaller --onefile --name backend --clean main.py
          ls -lh dist/backend
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build Flutter Linux
        run: |
          cd frontend
          flutter pub get
          flutter build linux --release
      - name: Package
        run: |
          BUNDLE=frontend/build/linux/x64/release/bundle
          cp dist/backend $BUNDLE/backend
          chmod +x $BUNDLE/backend
          mkdir -p release
          tar -czf release/xiaoling-linux-${{ env.APP_VERSION }}.tar.gz -C $(dirname $BUNDLE) $(basename $BUNDLE)
          ls -lh release/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/xiaoling-linux-${{ env.APP_VERSION }}.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal Python deps
        run: |
          pip install grpcio grpcio-tools protobuf Pillow numpy requests aiohttp
          pip install pyinstaller
      - name: Bundle backend
        run: |
          pyinstaller --onefile --name backend --clean main.py
          dir dist
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build Flutter Windows
        run: |
          cd frontend
          flutter pub get
          flutter build windows --release
      - name: Package
        run: |
          $releaseDir = "frontend\build\windows\x64\runner\Release"
          Copy-Item "dist\backend.exe" "$releaseDir\backend.exe"
          if (!(Test-Path "release")) { New-Item -ItemType Directory -Path "release" }
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "release\xiaoling-windows-${{ env.APP_VERSION }}.zip" -Force
          dir release
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/xiaoling-windows-${{ env.APP_VERSION }}.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal Python deps
        run: |
          pip install grpcio grpcio-tools protobuf Pillow numpy requests aiohttp
          pip install pyinstaller
      - name: Bundle backend
        run: |
          pyinstaller --onefile --name backend --clean main.py
          ls -lh dist/backend
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build Flutter macOS
        run: |
          cd frontend
          flutter pub get
          flutter build macos --release
      - name: Package
        run: |
          APP=$(find frontend/build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "App found: $APP"
          if [ -z "$APP" ]; then echo "No .app found"; ls -R frontend/build/macos/Build/Products/Release/; exit 1; fi
          cp dist/backend "$APP/Contents/MacOS/backend"
          chmod +x "$APP/Contents/MacOS/backend"
          mkdir -p release
          hdiutil create -volname "XiaoLing" -srcfolder "$(dirname $APP)" -ov -format UDZO release/xiaoling-macos-${{ env.APP_VERSION }}.dmg
          ls -lh release/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/xiaoling-macos-${{ env.APP_VERSION }}.dmg

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Build Android APK
        run: |
          cd frontend
          flutter pub get
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/
      - name: Rename
        run: |
          cp frontend/build/app/outputs/flutter-apk/app-release.apk xiaoling-android-${{ env.APP_VERSION }}.apk
          ls -lh xiaoling-android-${{ env.APP_VERSION }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: xiaoling-android-${{ env.APP_VERSION }}.apk

  create-release:
    needs: [build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Display files
        run: ls -lhR artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "XiaoLing v${{ env.APP_VERSION }}"
          body: |
            XiaoLing AI Companion v${{ env.APP_VERSION }}
            
            全平台构建产物（Flutter UI + Python gRPC 后端）：
            - Linux x64 (tar.gz)
            - Windows x64 (zip)
            - macOS (dmg)
            - Android (apk, 含 Chaquopy Python 沙箱)
            
            后端已内置 --no-web 启动参数，gRPC 服务监听 localhost:50051。
          files: |
            artifacts/linux/*.tar.gz
            artifacts/windows/*.zip
            artifacts/macos/*.dmg
            artifacts/android/*.apk
