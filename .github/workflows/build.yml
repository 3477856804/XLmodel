name: 打包发布

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pillow numpy edge-tts

      - name: PyInstaller 打包
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          pyinstaller --noconfirm --clean \
            --name XiaoLing \
            --add-data "core${SEP}core" \
            --add-data "renderer${SEP}renderer" \
            --add-data "角色模型${SEP}角色模型" \
            --add-data "动作资产${SEP}动作资产" \
            --collect-submodules PySide6 \
            xl.py

      - name: 打包为压缩包
        shell: bash
        run: |
          mkdir -p dist_pkg
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip dist_pkg/XiaoLing-Windows.zip ./dist/XiaoLing/*
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cd dist && zip -r ../dist_pkg/XiaoLing-macOS.zip XiaoLing && cd ..
          else
            cd dist && zip -r ../dist_pkg/XiaoLing-Linux.zip XiaoLing && cd ..
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: XiaoLing-${{ matrix.os }}
          path: dist_pkg/*
