name: 单文件打包

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy pillow grpcio protobuf
      - name: PyInstaller 单文件打包（新三语言架构：main.py + backend/ + resources/）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          pyinstaller --noconfirm --clean --onefile \
            --name XiaoLing \
            --add-data "backend${SEP}backend" \
            --add-data "resources${SEP}resources" \
            --exclude-module torch \
            --exclude-module PySide6 \
            --exclude-module PyQt5 \
            --exclude-module matplotlib \
            --exclude-module numpy.tests \
            main.py
      - name: 重命名
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv XiaoLing.exe XiaoLing-Windows.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mv XiaoLing XiaoLing-macOS
            zip -q XiaoLing-macOS.zip XiaoLing-macOS
          else
            mv XiaoLing XiaoLing-Linux
            tar -czf XiaoLing-Linux.tar.gz XiaoLing-Linux
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoLing-${{ matrix.os }}
          path: dist/*
      - name: 上传到 Release v0.0.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.1
          files: |
            dist/XiaoLing-*.exe
            dist/XiaoLing-*.tar.gz
            dist/XiaoLing-*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
