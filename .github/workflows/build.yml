name: 单文件打包

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy pillow grpcio protobuf requests aiohttp
      - name: PyInstaller 打包
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          pyinstaller --noconfirm --clean --onefile \
            --name XiaoLing \
            --add-data "backend${SEP}backend" \
            --add-data "resources${SEP}resources" \
            --collect-submodules google.protobuf \
            --collect-submodules grpc \
            --hidden-import requests \
            --hidden-import aiohttp \
            --exclude-module torch \
            --exclude-module PySide6 \
            --exclude-module PyQt5 \
            --exclude-module matplotlib \
            --exclude-module numpy.tests \
            main.py
      - name: Windows 重命名
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/XiaoLing.exe dist/XiaoLing-Windows.exe
      - name: macOS 打 dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/dmg
          cp dist/XiaoLing dist/dmg/XiaoLing
          hdiutil create -volname "小凌 XIAOLING" -srcfolder dist/dmg -ov -format UDZO dist/XiaoLing-macOS.dmg
      - name: Linux 打 AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/AppDir/usr/bin
          cp dist/XiaoLing dist/AppDir/usr/bin/xiaoling
          printf '#!/bin/bash\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/xiaoling" "$@"\n' > dist/AppDir/AppRun
          chmod +x dist/AppDir/AppRun
          printf '[Desktop Entry]\nName=XiaoLing\nExec=xiaoling\nType=Application\nIcon=xiaoling\nCategories=Utility;\n' > dist/AppDir/xiaoling.desktop
          python3 -c "import struct,zlib; open('dist/AppDir/xiaoling.png','wb').write(b'\x89PNG\r\n\x1a\n'+struct.pack('>II',1,1)+b'\x00\x00\x00\x0dIDATx\x9cc\x00\x01\x00\x00\x05\x00\x01\r\n-\xb4\x00\x00\x00\x00IEND\xaeB\x60\x82')"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O dist/appimagetool
          chmod +x dist/appimagetool
          dist/appimagetool --appimage-extract-and-run dist/AppDir dist/XiaoLing-Linux.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoLing-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
      - name: 上传到 Release v0.0.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.5
          files: |
            dist/XiaoLing-*.exe
            dist/XiaoLing-*.dmg
            dist/XiaoLing-*.AppImage
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
