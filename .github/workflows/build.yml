name: 单文件打包

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pillow numpy edge-tts torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: PyInstaller 单文件打包（精细打包，排除无用Qt模块）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          pyinstaller --noconfirm --clean --onefile \
            --name XiaoLing \
            --icon assets/icon.ico \
            --add-data "core${SEP}core" \
            --add-data "renderer${SEP}renderer" \
            --add-data "角色模型${SEP}角色模型" \
            --add-data "动作资产${SEP}动作资产" \
            --add-data "assets${SEP}assets" \
            --collect-submodules PySide6.QtWidgets \
            --collect-submodules PySide6.QtGui \
            --collect-submodules PySide6.QtCore \
            --exclude-module PySide6.QtWebEngine \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtMultimediaWidgets \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.Qt3DAnimation \
            --exclude-module PySide6.Qt3DExtras \
            --exclude-module PySide6.Qt3DInput \
            --exclude-module PySide6.Qt3DLogic \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtPdf \
            --exclude-module PySide6.QtPdfWidgets \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtLocation \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtNfc \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtSql \
            --exclude-module torch.cuda \
            --exclude-module torch.distributed \
            --exclude-module torch.distributions \
            --exclude-module torch.onnx \
            --exclude-module torch.jit \
            xl.py
      - name: 重命名
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv XiaoLing.exe XiaoLing-Windows.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mv XiaoLing XiaoLing-macOS
            zip -q XiaoLing-macOS.zip XiaoLing-macOS
          else
            mv XiaoLing XiaoLing-Linux
            tar -czf XiaoLing-Linux.tar.gz XiaoLing-Linux
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoLing-${{ matrix.os }}
          path: dist/*
      - name: 上传到 Release v0.0.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.3
          files: |
            dist/XiaoLing-*.exe
            dist/XiaoLing-*.tar.gz
            dist/XiaoLing-*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
