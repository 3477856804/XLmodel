name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 安装依赖（测试只需轻量包）
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy PyOpenGL pyinstaller
      - name: 回归测试（无需 torch / 无需显示器）
        run: |
          python tests/test_growth.py
          python tests/test_fusion.py
          python tests/test_avatar.py
          python tests/test_renderer.py
      - name: 打包冒烟（精简版）
        run: python packaging/build.py --lite --zip --clean
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoling-lite-linux
          path: dist/*.zip
