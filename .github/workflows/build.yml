name: 单文件打包

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 pillow numpy edge-tts torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: PyInstaller 单文件打包
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          pyinstaller --noconfirm --clean --onefile \
            --name XiaoLing \
            --icon assets/icon.ico \
            --add-data "core${SEP}core" \
            --add-data "renderer${SEP}renderer" \
            --add-data "角色模型${SEP}角色模型" \
            --add-data "动作资产${SEP}动作资产" \
            --add-data "assets${SEP}assets" \
            --collect-all PySide6 \
            xl.py
      - name: 重命名产物
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/XiaoLing.exe dist/XiaoLing-Windows.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mv dist/XiaoLing dist/XiaoLing-macOS
          else
            mv dist/XiaoLing dist/XiaoLing-Linux
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: XiaoLing-single-${{ matrix.os }}
          path: dist/*
