name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      lite:
        description: '只出精简版（体积小，无 torch/Qt）'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy PyOpenGL pyinstaller
      - name: 六套回归测试
        run: |
          python 测试/test_growth.py
          python 测试/test_growth_v2.py
          python 测试/test_fusion.py
          python 测试/test_avatar.py
          python 测试/test_renderer.py
          python 测试/test_launcher_ui.py
      - name: 全系统自检（诊断输出，不作为发布门禁）
        # 自检在「无基底模型 / 未配 API Key / 无 3D 依赖」的 CI 环境里必然判为 fail
        # （issues >= 3 → health=fail → exit 1），因此这里只保留可观测性，不阻塞发布。
        # 真正的门禁是上面的六套回归测试。
        run: python -m core.selftest || true

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            args: '--zip'
          - os: ubuntu-latest
            target: linux-x64
            args: '--zip --deb'
          - os: macos-latest
            target: macos-arm64
            args: '--zip --dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Linux 系统依赖（Mesa 软件 GL / 打包工具）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libosmesa6 libgl1-mesa-dri libgl1 fakeroot
      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install Pillow numpy PyOpenGL pyinstaller
          pip install pyinstaller
      - name: 打包
        shell: bash
        run: |
          LITE_FLAG=""
          if [ "${{ github.event.inputs.lite }}" = "true" ]; then LITE_FLAG="--lite"; fi
          python 打包/build.py $LITE_FLAG ${{ matrix.args }}
      - name: 产物自检（无头渲染一帧）
        shell: bash
        run: |
          if [ -x dist/xiaoling/xiaoling ]; then dist/xiaoling/xiaoling --growth || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoling-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/manifest.json
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          name: 小凌 XIAOLING ${{ github.ref_name }}
